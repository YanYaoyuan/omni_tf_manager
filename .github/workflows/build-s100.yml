name: Build RDK S100 (cross compile)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Artifact version (optional)"
        required: false
        type: string

concurrency:
  group: s100-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: vars.OMNI_ENABLE_S100_BUILD == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      VERSION_INPUT: ${{ inputs.version }}
      S100_IMAGE: pc_tros_ubuntu22.04:v1.0.0
      S100_IMAGE_URL: http://archive.d-robotics.cc/TogetheROS/cross_compile_docker/pc_tros_ubuntu22.04_v1.0.0.tar.gz
      S100_IMAGE_SHA256: ec065c268782373311421f0bb7f2212bfec6584a7070a9737468055a6bce2c88
      ROBOT_DEV_CONFIG_REF: f44b1ad2575b34c189fd470de1db9c5ad48b6886
      S100_SYSROOT_REF: de9fa286f71a72d24c349477cd59f41cc2cc3d8f

    steps:
      - name: Checkout Omni TF Manager
        uses: actions/checkout@v7.0.1

      - name: Validate packaging scripts
        run: bash -n scripts/*.sh

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail

          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            || true

          docker system prune --all --force || true
          df -h

      - name: Load official TROS cross-compilation image
        shell: bash
        run: |
          set -euo pipefail

          image_archive="${RUNNER_TEMP}/pc_tros_ubuntu22.04_v1.0.0.tar.gz"
          curl --fail --location \
            --retry 5 --retry-all-errors --continue-at - \
            --output "${image_archive}" \
            "${S100_IMAGE_URL}"
          echo "${S100_IMAGE_SHA256}  ${image_archive}" | sha256sum --check
          docker load --input "${image_archive}"
          docker image inspect "${S100_IMAGE}" \
            --format='ID={{.Id}} ARCH={{.Architecture}} OS={{.Os}}'

      - name: Cross compile S100
        shell: bash
        run: |
          set -euo pipefail

          export S100_SOURCE_ROOT="${GITHUB_WORKSPACE}"
          export S100_WORK_ROOT="${RUNNER_TEMP}/s100-cross"
          export S100_CLEAN=1

          ./scripts/build_s100_cross.sh

          cross_root="${S100_WORK_ROOT}/cc_ws/tros_ws"
          test -x "${cross_root}/install/lib/omni_tf_manager/omni_tf_manager_node"
          test -f "${cross_root}/install/share/omni_tf_manager/config/generic_four_sensor.yaml"
          test -f "${cross_root}/install/share/omni_tf_manager/config/omni_dog.yaml"
          test -f "${cross_root}/install/share/omni_tf_manager/config/omni_vbot_dog.yaml"
          file "${cross_root}/install/lib/omni_tf_manager/omni_tf_manager_node" \
            | grep -Eq 'ARM aarch64|ARM64'

      - name: Package S100 runtime
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          cross_root="${RUNNER_TEMP}/s100-cross/cc_ws/tros_ws"
          runtime_root="${cross_root}/runtime"
          ./scripts/package_s100_runtime.sh \
            "${cross_root}/install" \
            "${runtime_root}"

          version="${VERSION_INPUT:-${GITHUB_SHA::12}}"
          version="${version//\//-}"
          name="omni-tf-manager-rdk-s100-aarch64-${version}-${GITHUB_SHA::12}"

          mkdir -p "dist/${name}"
          cp -a "${runtime_root}/." "dist/${name}/"
          cat > "dist/${name}/manifest.json" <<EOF
          {
            "project": "omni_tf_manager",
            "version": "${version}",
            "git_sha": "${GITHUB_SHA}",
            "platform": "rdk-s100-rdkos-4",
            "architecture": "aarch64",
            "ros_distribution": "humble",
            "built_at_utc": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          sha256sum "dist/${name}.tar.gz" > "dist/${name}.tar.gz.sha256"
          ls -lh "dist/${name}.tar.gz" "dist/${name}.tar.gz.sha256"

      - name: Upload S100 runtime
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: omni-tf-manager-rdk-s100-aarch64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 3

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GITHUB_WORKSPACE}"
          test -n "${RUNNER_TEMP}"

          sudo rm -rf \
            "${GITHUB_WORKSPACE}/build" \
            "${GITHUB_WORKSPACE}/install" \
            "${GITHUB_WORKSPACE}/log" \
            "${GITHUB_WORKSPACE}/dist" \
            "${RUNNER_TEMP}/s100-cross"

          docker system prune --all --force || true
          df -h
