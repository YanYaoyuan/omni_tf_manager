omni_tf_manager:
  ros__parameters:
    mode: shadow
    profile_name: matrix_xgw
    profile_version: 1.0.0
    calibration_id: MATRIX_CONFIG_2026_08_21_UNVERIFIED
    use_sim_time: false

    frames.map: lio_map
    frames.odom: lio_odom
    frames.base: scan_base_link
    frames.tracking: livox_frame

    topics.sensor_odom: /state_estimation
    topics.icp_pose: /icp_result
    topics.local_body_odom: /omni/tf_manager/body_odom
    topics.global_body_odom: /omni/tf_manager/body_odom_global
    topics.diagnostics: /diagnostics
    topics.ready: /omni/tf_manager/ready

    publish.local_body_odom: true
    publish.global_body_odom: true
    publish.add_map_covariance: false

    map_to_odom.source: icp_pose
    map_to_odom.is_static: true
    map_to_odom.allow_reinitialization: false
    map_to_odom.translation_jump_limit_m: 2.0
    map_to_odom.rotation_jump_limit_rad: 0.7853981633974483
    map_to_odom.translation: [0.0, 0.0, 0.0]
    map_to_odom.rotation_rpy: [0.0, 0.0, 0.0]

    validation.require_nonzero_stamp: true
    validation.require_monotonic_stamp: true
    validation.max_input_age_s: 1.0
    validation.max_icp_age_s: 30.0
    validation.max_future_offset_s: 0.1
    validation.quaternion_norm_tolerance: 0.05
    validation.max_linear_speed_mps: 3.0
    validation.max_angular_speed_radps: 6.0
    validation.position_jump_margin_m: 0.35
    validation.rotation_jump_margin_rad: 0.25
    timeouts.sensor_odom_s: 0.5
    diagnostics.period_s: 0.5

    required_sensor_roles: [lidar, imu, depth_camera, rgb_camera]
    static_transforms:
      - lidar_mount
      - lidar_input_alias
      - livox_imu
      - depth_camera_link
      - depth_camera_optical
      - rgb_camera_link
      - rgb_camera_optical

    # UE configuration is centimetres with +Y to the right. Values below are
    # converted to ROS metres with +Y to the left. Confirm against the active
    # MATRiX release before promoting this profile to authority mode.
    static_transform.lidar_mount.role: lidar
    static_transform.lidar_mount.parent_frame: scan_base_link
    static_transform.lidar_mount.child_frame: livox_frame
    static_transform.lidar_mount.translation: [0.13011, -0.02329, 0.17598]
    static_transform.lidar_mount.rotation_rpy: [0.0, 0.0, 0.0]

    # MATRiX PointCloud2 currently reports header.frame_id="lidar" while
    # FAST-LIO uses livox_frame for the same physical measurement origin.
    static_transform.lidar_input_alias.role: ""
    static_transform.lidar_input_alias.parent_frame: livox_frame
    static_transform.lidar_input_alias.child_frame: lidar
    static_transform.lidar_input_alias.translation: [0.0, 0.0, 0.0]
    static_transform.lidar_input_alias.rotation_rpy: [0.0, 0.0, 0.0]

    # The MATRiX livox IMU site is colocated with the simulated LiDAR.
    static_transform.livox_imu.role: imu
    static_transform.livox_imu.parent_frame: livox_frame
    static_transform.livox_imu.child_frame: livox_imu_link
    static_transform.livox_imu.translation: [0.0, 0.0, 0.0]
    static_transform.livox_imu.rotation_rpy: [0.0, 0.0, 0.0]

    static_transform.depth_camera_link.role: depth_camera
    static_transform.depth_camera_link.parent_frame: scan_base_link
    static_transform.depth_camera_link.child_frame: depth_camera_link
    static_transform.depth_camera_link.translation: [0.29, 0.0, 0.01]
    static_transform.depth_camera_link.rotation_rpy: [0.0, 0.2617993877991494, 0.0]

    static_transform.depth_camera_optical.role: ""
    static_transform.depth_camera_optical.parent_frame: depth_camera_link
    static_transform.depth_camera_optical.child_frame: depth_camera_optical_frame
    static_transform.depth_camera_optical.translation: [0.0, 0.0, 0.0]
    static_transform.depth_camera_optical.rotation_rpy: [-1.5707963267948966, 0.0, -1.5707963267948966]

    # Current MATRiX depth messages have been observed with frame_id="map".
    # Fix the simulator publisher to depth_camera_optical_frame before using
    # depth data in TF-based fusion; the manager never relabels sensor data.

    # The current MATRiX RGB message uses frame_id="front". Treat front as
    # the mechanical camera link and provide a REP-103 optical child frame.
    static_transform.rgb_camera_link.role: rgb_camera
    static_transform.rgb_camera_link.parent_frame: scan_base_link
    static_transform.rgb_camera_link.child_frame: front
    static_transform.rgb_camera_link.translation: [0.29, 0.0, 0.01]
    static_transform.rgb_camera_link.rotation_rpy: [0.0, 0.2617993877991494, 0.0]

    static_transform.rgb_camera_optical.role: ""
    static_transform.rgb_camera_optical.parent_frame: front
    static_transform.rgb_camera_optical.child_frame: rgb_camera_optical_frame
    static_transform.rgb_camera_optical.translation: [0.0, 0.0, 0.0]
    static_transform.rgb_camera_optical.rotation_rpy: [-1.5707963267948966, 0.0, -1.5707963267948966]
